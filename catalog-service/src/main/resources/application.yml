server:
  port: ${SERVER_PORT:8082}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/catalogservice?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio-local-only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
